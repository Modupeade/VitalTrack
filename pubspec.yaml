  flutter:
    sdk: flutter
  
  ms_ble_data_analysis:
    git:
      url: https://gitee.com/yhmedical-app/ms_ble_data_analysis.git
      ref: master # branch name, usually same as the device name
  pay: ^3.2.1
  in_app_purchase: ^3.2.0
  in_app_purchase_android: ^0.4.0
  intl: ^0.20.2

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.2
  get: ^4.6.5
  google_fonts: ^6.3.2
  cached_network_image: ^3.2.3
  loading_overlay: ^0.5.0
  flutter_spinkit: ^5.2.0
  fluttertoast: ^9.0.0
  jiffy: ^6.2.1
  cupertino_stepper: ^0.2.1
  flutter_speed_dial: ^7.0.0
  firebase_core: ^4.2.1
  cloud_firestore: ^6.1.0
  firebase_auth: ^6.1.2
  firebase_storage: ^13.0.4
  chewie: ^1.7.1
  video_player: ^2.7.1
  syncfusion_flutter_charts: ^31.2.12
  awesome_notifications: ^0.10.1
  age_calculator: ^1.0.0
  url_launcher: ^6.1.14
  # flutter_app_badger: ^1.5.0  # Discontinued package - removed
  keyboard_dismisser: ^3.0.0
  tab_indicator_styler: ^2.0.0
  fl_chart: ^1.1.1
  shared_preferences:
  firebase_messaging:
  mailer: ^6.0.1
  pdf: ^3.11.1
  printing: ^5.13.4
  path_provider: ^2.1.4
  facebook_app_events: ^0.19.2
  permission_handler: ^12.0.3
  flutter_blue_plus: ^2.3.10
  provider: ^6.0.0
  http: ^1.2.2

